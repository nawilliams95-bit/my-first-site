<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" aria-label="RealtyDataLabs">
  <!-- Outer ring -->
  <circle cx="24" cy="24" r="22" stroke="url(#grad)" stroke-width="2" fill="none"/>
  <!-- Bar chart representing data / real estate -->
  <rect x="10" y="28" width="6" height="10" rx="1.5" fill="#2D5BE3"/>
  <rect x="19" y="20" width="6" height="18" rx="1.5" fill="url(#grad)"/>
  <rect x="28" y="14" width="6" height="24" rx="1.5" fill="#00D4AA"/>
  <!-- Rising trend line -->
  <polyline points="13,26 22,18 31,12 38,8" stroke="#00D4AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
  <!-- Trend dot -->
  <circle cx="38" cy="8" r="2.5" fill="#00D4AA"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D5BE3"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
  </defs>
</svg>
